services:
  # FastAPI REST API + Playwright Scraper Service
  - type: web
    name: data-scrapper
    env: python
    buildCommand: "pip install -r render_requirements.txt && playwright install chromium"
    startCommand: "uvicorn api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

